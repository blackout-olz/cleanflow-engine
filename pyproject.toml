[project]
name = "cleanflow-engine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "gspread>=6.2.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
